name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step at all: this game has zero runtime dependencies and zero build
      # steps (package.json declares only electron as a devDependency, which `check`/`test`
      # never import). Pulling a package graph into CI would only add network flakes, and
      # there is no lockfile to honour — `--frozen-lockfile` would be theatre.
      #
      # EVERY step below names a file that exists in this repo at this commit. Two steps
      # the sibling repos carry are deliberately ABSENT, because their files are not
      # written yet:  tools/bake.mjs  (烘焙题池). The other two — tools/verify.sh +
      # tools/scenarios.js (浏览器闸) and tools/balance.mjs (难度阶梯) — now exist, so they
      # run for real: balance below, the browser gate in the `browser` job.
      # When bake lands, add its step for real. Do NOT gate it with `|| true`,
      # `continue-on-error`, or "skip if the file is missing": a gate that passes because
      # the thing it checks does not exist is a lie written into the door.
      - name: Syntax check every source
        run: npm run check

      - name: Syntax check the harness
        run: |
          for f in $(git ls-files 'tools/*.mjs' 'tools/*.cjs'); do node --check "$f" || exit 1; done

      # The engine's own promises: contradiction detection, the tap/stroke/undo state
      # machine, "a shipped board is pencil-solvable AND unique per the second,
      # deliberately distrustful enumerator", and rng/daily-seed determinism.
      # 438 assertions across 8 sections (A1 A2 B C D1 D2 D3 E) as of this commit — the
      # counts in the report are summed by the harness, not typed by hand.
      - name: Engine tests
        run: node tools/engine-test.mjs

      # The difficulty promise, measured: 5 samples/tier generate live, the quantile
      # table is printed, and the gate goes red unless every tier ships all its
      # samples, every sample lands in its own band (100%), and the five p50s strictly
      # increase. SAMPLES=24 is the release calibration the TIERS bands were written
      # from; the run is deterministic (seeds `scn|<tier>|<i>`), so a red here means
      # the engine moved under the bands, not that the dice rolled badly.
      - name: Balance ladder (measured bands, per tier)
        run: SAMPLES=24 node tools/balance.mjs

      # 帧率无关不是"有个 dt 变量"就算做了：官方 cos_frame_probe.js 对 ESM 仓只会说
      # "无法比对"，而 tools/frame_harness.mjs 自己造时钟（30/60/120Hz + 抖动档、按仿真刻度
      # 对齐）并把两条阴性对照钉在会红的行上 —— 一台量不出红色的量具不算量具。
      - name: Frame-rate harness (dt independence + negative controls)
        run: node tools/frame_harness.mjs

      # The entry graph must be reachable: index.html loads js/main.js as a module, and
      # that file is what mounts window.nurikabe (the surface the browser gate reads).
      # A missing entry file used to pass CI silently because nothing checked it existed.
      - name: Entry files exist and mount the harness surface
        run: |
          test -f index.html
          test -f js/main.js
          grep -q '<canvas' index.html
          grep -q 'js/main.js' index.html
          grep -q 'window.nurikabe' js/main.js
          grep -q 'window.App' js/main.js

      # The icon/PWA promise as a red build instead of an adjective: every local path
      # index.html and manifest.json reference must exist on disk, every .png must carry a
      # real PNG signature with IHDR matching the size it claims, apple-touch-icon must be
      # one unique ≥180px bitmap, and sw.js must be versioned + network-first. This catches
      # the three fake-greens this family has actually shipped: an inline data-URI SVG
      # standing in for "we have an icon", a manifest pointing at pngs that were never
      # committed, and a 0-byte placeholder that passes an existence check.
      - name: Art assets are real bitmaps and every reference resolves
        run: node tools/check_assets.mjs

      # What the four steps above do NOT cover: the page actually booting in a real browser
      # (no uncaught exceptions, every element id owned, dirty save files, the canvas pixels
      # matching what the engine claims). That is the `browser` job below.

  # tools/verify.sh is the fifth gate and, until this job existed, CI had never run it:
  # 755 browser assertions per URL shape (first zero hint conflict save resume daily layout
  # narrow), measured 2026-09-28. A gate that is only ever run by hand is documentation,
  # not a gate. One invocation covers both shapes — this verify.sh starts its own prefix
  # server on a second port, because a different origin is what gives localStorage a
  # different cupboard, and Pages serves us under /z-biz-game-nurikabe-cos/.
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 22, not the 20 the check job uses: tools/playtest.cjs is a raw CDP driver written
        # against Node's global WebSocket/fetch, which only exist from 22 on. On 20 the first
        # attach dies with "WebSocket is not defined" and the job goes red before a single
        # assertion runs.
        with:
          node-version: 22
      # ubuntu-latest ships google-chrome on PATH, which is what tools/verify.sh looks for
      # (alongside the macOS bundle path). No install step: apt/dpkg on a pinned image is a
      # flake source, and a step that can die of networking reads as "the game is broken".
      # Viewports come from verify.sh's own defaults (VIEWPORT_DEFAULT=1280x1024,
      # VIEWPORT_NARROW=500x780) and are applied by a CDP Emulation.setDeviceMetricsOverride
      # before the first navigation (tools/playtest.cjs:127), so this job needs no xorg /
      # no window manager: nothing here measures a real window. That is also why the numbers
      # are safe to assert verbatim — the narrow scenario compares innerWidth,innerHeight
      # against '500,780' (tools/scenarios.js:1187) and run 36349670387 passed both shapes
      # with these defaults. If some future runner's Chrome stops honoring the height,
      # VIEWPORT_NARROW is the lever and that eq() prints the number it actually got.
      - name: Browser gate (root + prefix)
        env:
          WD_TIMEOUT: 900
        run: bash tools/verify.sh
