name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler and no build step: the game ships plain ES modules, so the site is a
      # file copy. What gets copied is the set of paths the page actually reaches at
      # runtime: css/game.css and js/*.js, manifest.json (linked from the head), sw.js
      # (registered by js/pwa.js), icons/*.png (favicon 32/16, apple-touch-icon 180,
      # PWA 192/512/maskable) and assets/img/*.png (the sea/paper textures the canvas
      # loads plus og-cover.png for crawlers). Leaving one out does not fail the build —
      # it 404s a single line in a real browser, which is exactly how "installable PWA"
      # stayed a claim about a file that was never deployed. assets/gen/ is the art
      # factory (source, not artifact) and stays out of the artifact on purpose.
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp index.html manifest.json sw.js _site/
          cp -r css js icons _site/
          cp -r assets/img _site/assets/
          find _site -type f | sort
      - uses: actions/configure-pages@v5
        # How to make a brand-new repo's first push deploy was measured twice here, and the
        # workflow cannot do it itself. No Pages site yet → this step 404s on GET /pages and
        # dies with "verify that the repository has Pages enabled" (run 36349670386). Add
        # `enablement: true` → the step tries to POST that site and GitHub refuses the
        # workflow's own token: "Resource not accessible by integration"
        # (run 36350157395). So one out-of-band call per new repo, with a credential that is
        # allowed to make it: POST /repos/<repo>/pages {"build_type":"workflow"} — made with
        # a human token held outside this repo, never as a repo secret. A red first push is
        # the honest outcome; the alternative was a conditional skip that reports a green
        # deploy for a site that was never published.
        # With the site enabled, the deploy of this repo's af10f9a went green and its 755
        # browser assertions were then run against the published artifact (see README).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
